# bundle patch for the recent-tabs plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/my-plugins/dsh-browser-tab`.
- insert:
    - id: ui-recent-tabs
      name: 'dsh-browser-tab'
